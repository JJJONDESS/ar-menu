<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Universal WebAR Menu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Include A-Frame and the official AR.js Libraries -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    
    <!-- Initialize the AR.js webcam scene without showing debug borders -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Load your 3D burger model file into the webpage assets -->
      <a-assets>
        <a-asset-item id="burger" src="burger.glb"></a-asset-item>
      </a-assets>

      <!-- Track the default universal 'Hiro' marker card -->
      <a-marker preset="hiro">
        <!-- Display your 3D burger directly on top of the marker. 
             You can adjust scale, position, and rotation values here if needed -->
        
        
      </a-marker>

      <!-- Activate the phone's web camera layer -->
      
      
    </a-scene>
  </body>
</html>
