<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D AR Menu</title>
    <!-- Import Google's Model-Viewer Engine -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #111; }
        /* Make the 3D preview occupy the full phone screen */
        model-viewer { width: 100%; height: 100%; }
        /* Style a professional, native-looking AR activation button */
        #ar-button {
            background-color: #ff5722; border-radius: 30px; border: none;
            color: white; padding: 14px 28px; font-family: sans-serif; font-weight: bold;
            font-size: 16px; position: absolute; bottom: 50px; left: 50%;
            transform: translateX(-50%); cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <!-- The 3D view layer that automatically switches into native phone AR -->
    <model-viewer 
        src="burger.glb" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-scale="fixed"
        camera-controls 
        touch-action="none"
        shadow-intensity="1.5"
        environment-image="legacy"
        alt="A realistic 3D Burger Menu Item">
        
        <!-- Custom Button the customer taps to place the food on their table -->
        <button slot="ar-button" id="ar-button">
            👋 PLACE BURGER ON TABLE
        </button>
        
    </model-viewer>

</body>
</html>
