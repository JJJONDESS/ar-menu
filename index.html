<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Burger Menu</title>
    <!-- Importing the cloud-optimized engine file directly -->
    <script type="module" src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        /* Scales the responsive container grid to occupy 100% viewport space */
        .menu-container { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
        model-viewer { width: 100%; height: 80vh; }
        .footer-banner { width: 100%; height: 20vh; background: #222; display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: 0 -4px 20px rgba(0,0,0,0.5); }
        .food-title { color: #fff; font-size: 24px; font-weight: bold; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 1px; }
        .food-desc { color: #aaa; font-size: 14px; margin: 0; text-align: center; max-width: 80%; }
    </style>
</head>
<body>

    <div class="menu-container">
        <!-- Self-contained 3D viewing container box layout -->
        <model-viewer 
            src="burger.glb" 
            camera-controls 
            auto-rotate 
            auto-rotate-delay="1000"
            rotation-per-second="30deg"
            touch-action="pan-y"
            shadow-intensity="1.5"
            exposure="1.2"
            alt="3D Interactive Food Item">
        </model-viewer>

        
        <div class="footer-banner">
            <h1 class="food-title">🍔 Signature Burger</h1>
            <p class="food-desc">Touch and drag the item above to inspect our fresh ingredients in full 3D rotation!</p>
        </div>
    </div>

</body>
</html>
